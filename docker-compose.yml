services:
  postgres:
    image: postgres:17
    container_name: passporttwin-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-passporttwin}
      POSTGRES_USER: ${POSTGRES_USER:-passporttwin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/schema.sql:/docker-entrypoint-initdb.d/schema.sql
      - ./infra/postgres/init/00-create-metabase-db.sql:/docker-entrypoint-initdb.d/00-create-metabase-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-passporttwin}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - passporttwin-net

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: passporttwin-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@passporttwin.dev
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks:
      - passporttwin-net

  backend:
    build:
      context: ./backend
    container_name: passporttwin-backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-passporttwin}:${POSTGRES_PASSWORD:-devpassword}@postgres:5432/passporttwin
      BASYX_AAS_URL: http://basyx-aas:4001/aasServer
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - passporttwin-net

  frontend:
    build:
      context: ./frontend
    container_name: passporttwin-frontend
    env_file: .env
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - passporttwin-net

  metabase:
    image: metabase/metabase:latest
    container_name: passporttwin-metabase
    restart: unless-stopped
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabase
      MB_DB_PORT: 5432
      MB_DB_USER: ${POSTGRES_USER:-passporttwin}
      MB_DB_PASS: ${POSTGRES_PASSWORD:-devpassword}
      MB_DB_HOST: postgres
      JAVA_TOOL_OPTIONS: "-Xmx1024m -Xms512m"
    ports:
      - "${METABASE_PORT:-3003}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - passporttwin-net

  basyx-aas:
    image: eclipsebasyx/aas-server:1.4.0
    container_name: passporttwin-basyx-aas
    restart: unless-stopped
    ports:
      - "4001:4001"
    environment:
      JAVA_TOOL_OPTIONS: "-Xmx1024m -XX:-UseContainerSupport"
    networks:
      - passporttwin-net

volumes:
  pgdata:
  pgadmin_data:

networks:
  passporttwin-net:
    driver: bridge