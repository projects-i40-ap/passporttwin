name: BI checks

on:
  pull_request:
    branches: [main, feature/analytics-snapshots]
  push:
    branches: [main]

jobs:
  fleet-sql-and-provisioning:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: passporttwin_bi_test
          POSTGRES_USER: passporttwin
          POSTGRES_PASSWORD: test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U passporttwin -d passporttwin_bi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://passporttwin:test-only@localhost:5432/passporttwin_bi_test
      PYTHONPATH: backend
      STORAGE_RAW_DIR: /tmp/passporttwin-bi-test-raw
      AI_LEGO_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r backend/requirements.txt
      - run: python -m pytest backend/tests bi/tests -v
